name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: ariane_app

      - name: Analyze code
        run: python check_flutter_analyze.py
        working-directory: ariane_app

      - name: Run tests
        run: flutter test
        working-directory: ariane_app

  build_windows:
    needs: build_and_test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: ariane_app

      - name: Build Windows application
        run: flutter build windows --release
        working-directory: ariane_app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ariane_app/build/windows/runner/Release/

  build_android:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: ariane_app

      - name: Build Android App Bundle
        run: flutter build appbundle --release
        working-directory: ariane_app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: ariane_app/build/app/outputs/bundle/release/
