name: Flutter CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  bump_version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: bump_version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Use a specific Flutter version or 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: ariane_app

      - name: Analyze code with threshold
        run: python check_flutter_analyze.py
        working-directory: ariane_app

      - name: Run tests
        run: flutter test
        working-directory: ariane_app

      - name: Build Windows application
        run: flutter build windows --release
        working-directory: ariane_app

      - name: List build directory
        run: ls -R ariane_app/build/windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ariane_app/build/windows/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: windows-build

      - name: List downloaded artifact structure
        run: ls -R windows-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-build/runner/Release/ariane_app.exe
            windows-build/runner/Release/flutter_windows.dll
            windows-build/runner/Release/runner.dll
          body: "Release ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
